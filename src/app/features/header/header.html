<header>
  <nav>
    <a routerLink="/" class="logoCont">
      <h3>KINO</h3>
      <h3 class="span">XII</h3>
    </a>

    <a routerLink="/sessions">
      <p class="labelS overlineText">Sessions</p>
    </a>
  </nav>

  <div class="right">
    <label>
      <app-search-bar></app-search-bar>
    </label>
    @if (!authService.isAuthenticated()) {
      <div class="authBtns">
        <button class="btn-primary customBtn" (click)="modalService.openSignUp()">Sign up</button>
        <button class="btn-secondary customBtn" (click)="modalService.openLogIn()">Log in</button>
      </div>
    } @else {
      <app-profile-menu />
    }
  </div>
</header>
