<section class="sessionPage">
  <div class="sessionPageHeading">
    <h2>Sessions</h2>
    <p class="BodyM secondaryColor">Browse showtimes across all venues</p>
  </div>
  <div class="sessionsPageContent">
    <app-filter></app-filter>
    @if (data(); as res) {
      <app-list [response]="res" (pageChange)="goToPage($event)" />
    } @else if (isLoading()) {
      <app-skeleton />
    } @else if (hasError()) {
      <div class="stateBox">
        <p class="BodyL">We couldn't load the sessions.</p>
        <button type="button" class="btn-secondary customBtn" (click)="load()">Try again</button>
      </div>
    }
  </div>
</section>
