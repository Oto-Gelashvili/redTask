<section class="sessionPage">
  <div class="sessionPageHeading">
    <h2>Sessions</h2>
    <p class="BodyM secondaryColor">Browse showtimes across all venues</p>
  </div>
  <div class="sessionsPageContent">
    <app-filter></app-filter>

    @if (data() || hasError()) {
      <app-list
        [response]="data()"
        [sortValue]="sortValue()"
        [hasError]="hasError()"
        [errorContent]="errorContent()"
        (pageChange)="goToPage($event)"
        (sortChange)="changeSort($event)"
        (retry)="load()"
      />
    } @else if (isLoading()) {
      <app-skeleton />
    }
  </div>
</section>
